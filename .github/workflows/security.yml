name: Security

on:
  push:
    branches:
      - main
      - master
      - deploy
  pull_request:

env:
  GO_VERSION: stable

jobs:
  vulnerability-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          set +e
          govulncheck -json ./... > vulns.json 2>&1
          EXIT_CODE=$?
          # Known false positive: GO-2026-4316 (chi RedirectSlashes through Stellar SDK transitive dep)
          # Filter out only that one; any other vuln still fails.
          FILTERED=$(jq -s '
            [.[] | select(.type == "vuln")] |
            map(select(.id != "GO-2026-4316")) |
            length
          ' vulns.json 2>/dev/null)
          if [ "$FILTERED" != "0" ] && [ -n "$FILTERED" ]; then
            echo "=== Unfiltered vulnerabilities found ==="
            jq -s '
              [.[] | select(.type == "vuln")] |
              map(select(.id != "GO-2026-4316"))
            ' vulns.json
            exit 1
          fi
          if [ "$EXIT_CODE" != "0" ]; then
            echo "govulncheck exited with code $EXIT_CODE — only known false positive(s) filtered"
          fi
          echo "No actionable vulnerabilities found"

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec -confidence medium ./...
