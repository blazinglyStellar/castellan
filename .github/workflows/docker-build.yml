name: Docker Build & Publish

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'migrations/**'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
      - 'app-frontend/**'
      - 'docker-compose*.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG: blazinglystellar

jobs:
  build-api:
    name: Build & Push castellan-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check paths
        id: paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go:
              - 'cmd/**'
              - 'internal/**'
              - 'migrations/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'go.mod'
              - 'go.sum'
              - 'docker-entrypoint.sh'

      - name: Set up Docker Buildx
        if: steps.paths.outputs.go == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.paths.outputs.go == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.paths.outputs.go == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: api
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/castellan-api:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/castellan-api:${{ github.sha }}
          cache-from: type=gha,scope=build-api
          cache-to: type=gha,mode=max,scope=build-api

  build-worker:
    name: Build & Push castellan-worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check paths
        id: paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go:
              - 'cmd/**'
              - 'internal/**'
              - 'migrations/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'go.mod'
              - 'go.sum'
              - 'docker-entrypoint.sh'

      - name: Set up Docker Buildx
        if: steps.paths.outputs.go == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.paths.outputs.go == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.paths.outputs.go == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: worker
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/castellan-worker:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/castellan-worker:${{ github.sha }}
          cache-from: type=gha,scope=build-worker
          cache-to: type=gha,mode=max,scope=build-worker

