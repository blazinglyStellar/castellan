name: Docker Build & Publish

on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'migrations/**'
      - 'Dockerfile'
      - 'docker-entrypoint.sh'
      - '.dockerignore'
      - 'go.mod'
      - 'go.sum'
      - 'app-frontend/**'
      - 'docker-compose*.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  ORG: blazinglystellar

jobs:
  build-api:
    name: Build & Push castellan-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check paths
        id: paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go:
              - 'cmd/**'
              - 'internal/**'
              - 'migrations/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'go.mod'
              - 'go.sum'
              - 'docker-entrypoint.sh'

      - name: Set up Docker Buildx
        if: steps.paths.outputs.go == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.paths.outputs.go == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.paths.outputs.go == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: api
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/castellan-api:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/castellan-api:${{ github.sha }}
          cache-from: type=gha,scope=build-api
          cache-to: type=gha,mode=max,scope=build-api

  build-worker:
    name: Build & Push castellan-worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check paths
        id: paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            go:
              - 'cmd/**'
              - 'internal/**'
              - 'migrations/**'
              - 'Dockerfile'
              - '.dockerignore'
              - 'go.mod'
              - 'go.sum'
              - 'docker-entrypoint.sh'

      - name: Set up Docker Buildx
        if: steps.paths.outputs.go == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.paths.outputs.go == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.paths.outputs.go == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          target: worker
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/castellan-worker:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/castellan-worker:${{ github.sha }}
          cache-from: type=gha,scope=build-worker
          cache-to: type=gha,mode=max,scope=build-worker

  build-frontend:
    name: Build & Push app-frontend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check paths
        id: paths
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'app-frontend/src/**'
              - 'app-frontend/public/**'
              - 'app-frontend/Dockerfile'
              - 'app-frontend/.dockerignore'
              - 'app-frontend/package.json'
              - 'app-frontend/package-lock.json'
              - 'app-frontend/tsconfig.json'
              - 'app-frontend/next.config.ts'

      - name: Set up Docker Buildx
        if: steps.paths.outputs.frontend == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.paths.outputs.frontend == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.paths.outputs.frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: app-frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/app-frontend:latest
            ${{ env.REGISTRY }}/${{ env.ORG }}/app-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.APP_FRONTEND_API_URL }}
            NEXT_PUBLIC_STELLAR_NETWORK=${{ vars.STELLAR_NETWORK || 'testnet' }}
          cache-from: type=gha,scope=build-frontend
          cache-to: type=gha,mode=max,scope=build-frontend
