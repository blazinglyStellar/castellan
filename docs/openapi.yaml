openapi: 3.1.0
info:
  title: Castellan API
  version: 0.1.0
  description: |
    Usage-based API monetization gateway with Stellar settlement.

    Authentication uses `Authorization: Bearer <token>`. Two token types are
    accepted:
      - **API keys** — prefixed `ca_`, long-lived, used for server-to-server
      - **Session tokens** — prefixed `st_`, short-lived, used by the dashboard

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.castellan.dev
    description: Production

paths:
  # ──────────────────────────────────────────────
  #   Health & Intro
  # ──────────────────────────────────────────────
  /:
    get:
      operationId: helloWorld
      summary: Welcome message
      security: []
      responses:
        "200":
          description: Welcome message
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Hello World
                required: [message]
  /health:
    get:
      operationId: healthCheck
      summary: Database health check
      security: []
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # ──────────────────────────────────────────────
  #   API Keys
  # ──────────────────────────────────────────────
  /api/v1/keys:
    get:
      operationId: listKeys
      summary: List all API keys for the authenticated consumer
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListKeysItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createKey
      summary: Create a new API key
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKeyRequest"
      responses:
        "201":
          description: Created API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/keys/{id}/revoke:
    post:
      operationId: revokeKey
      summary: Revoke an API key
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: API key ID
      responses:
        "200":
          description: Revoked API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/keys/{id}/rotate:
    post:
      operationId: rotateKey
      summary: Rotate an API key (revoke old, return new)
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: API key ID
      responses:
        "200":
          description: New API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateKeyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ──────────────────────────────────────────────
  #   Sessions
  # ──────────────────────────────────────────────
  /api/v1/sessions:
    post:
      operationId: createSession
      summary: Create a new session token
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Created session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listSessions
      summary: List all session tokens for the authenticated consumer
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: List of session tokens
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/sessions/{id}/revoke:
    post:
      operationId: revokeSession
      summary: Revoke a session token
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Session token ID
      responses:
        "200":
          description: Revoked session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeSessionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ──────────────────────────────────────────────
  #   Providers
  # ──────────────────────────────────────────────
  /api/v1/providers:
    post:
      operationId: createProvider
      summary: Register a new upstream provider
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProviderRequest"
      responses:
        "201":
          description: Created provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listProviders
      summary: List all providers for the authenticated consumer
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: List of providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Provider"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/providers/{id}:
    get:
      operationId: getProvider
      summary: Get a provider by ID
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Provider ID
      responses:
        "200":
          description: Provider details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateProvider
      summary: Partially update a provider's name or base URL
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Provider ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProviderRequest"
      responses:
        "200":
          description: Updated provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/providers/{id}/status:
    patch:
      operationId: updateProviderStatus
      summary: Update a provider's status
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Provider ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProviderStatusRequest"
      responses:
        "200":
          description: Updated provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteProvider
      summary: Delete a provider and all its endpoints
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Provider ID
      responses:
        "204":
          description: Provider deleted (no content)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ──────────────────────────────────────────────
  #   Endpoints
  # ──────────────────────────────────────────────
  /api/v1/providers/{providerId}/endpoints:
    post:
      operationId: createEndpoint
      summary: Register a new endpoint under a provider
      security: [{ BearerAuth: [] }]
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Provider ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEndpointRequest"
      responses:
        "201":
          description: Created endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      operationId: listEndpoints
      summary: List all endpoints for a provider
      security: [{ BearerAuth: [] }]
      parameters:
        - name: providerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Provider ID
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, inactive, draft]
          description: Filter by endpoint status
      responses:
        "200":
          description: List of endpoints
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Endpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/endpoints/{id}:
    get:
      operationId: getEndpoint
      summary: Get an endpoint by ID
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Endpoint ID
      responses:
        "200":
          description: Endpoint details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateEndpoint
      summary: Partially update an endpoint's configuration
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Endpoint ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEndpointRequest"
      responses:
        "200":
          description: Updated endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteEndpoint
      summary: Delete an endpoint
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Endpoint ID
      responses:
        "204":
          description: Endpoint deleted (no content)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/endpoints/{id}/status:
    patch:
      operationId: updateEndpointStatus
      summary: Update an endpoint's status
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Endpoint ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEndpointStatusRequest"
      responses:
        "200":
          description: Updated endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Endpoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ──────────────────────────────────────────────
  #   Accounts
  # ──────────────────────────────────────────────
  /api/v1/accounts/me:
    get:
      operationId: getAccount
      summary: Get the authenticated consumer's account
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Account details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/accounts/me/entries:
    get:
      operationId: listEntries
      summary: List ledger entries for the authenticated consumer
      security: [{ BearerAuth: [] }]
      parameters:
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [deposit, reservation, deduction, refund, settlement]
          description: Filter by entry type
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum results (max 100)
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of results to skip
      responses:
        "200":
          description: Paginated list of entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEntriesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/accounts/me/entries/{id}:
    get:
      operationId: getEntry
      summary: Get a specific ledger entry
      security: [{ BearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Entry ID
      responses:
        "200":
          description: Entry details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EntryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  # ──────────────────────────────────────────────
  #   Deposits
  # ──────────────────────────────────────────────
  /api/v1/deposits/intent:
    get:
      operationId: depositIntent
      summary: Get deposit instructions (SEP-7 URI + QR code)
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: Deposit intent details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepositIntentResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/deposits:
    get:
      operationId: listDeposits
      summary: List deposit history
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          description: List of deposits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DepositResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ──────────────────────────────────────────────
  #   Settlements
  # ──────────────────────────────────────────────
  /api/v1/settlements:
    get:
      operationId: listSettlements
      summary: List settlement batch history
      security: [{ BearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          description: Maximum results (max 100)
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
          description: Number of results to skip
      responses:
        "200":
          description: Paginated list of settlement batches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListSettlementsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  # ──────────────────────────────────────────────
  #   Gateway
  # ──────────────────────────────────────────────
  /api/gateway/{providerId}/{endpoint}:
    parameters:
      - name: providerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Provider ID
      - name: endpoint
        in: path
        required: true
        schema:
          type: string
        description: Endpoint route path (e.g. `v1/chat/completions`)
    post:
      operationId: proxyRequest
      summary: Proxy a request to an upstream provider endpoint
      description: |
        Authenticates, resolves pricing, checks balance, reserves funds,
        proxies the request upstream, captures usage, and commits or
        releases the reservation based on upstream response.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Forwarded to the upstream provider
      responses:
        "200":
          description: Upstream response
          content:
            application/json:
              schema:
                type: object
                description: Response from the upstream provider
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "402":
          description: Insufficient balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: insufficient_balance
                  balance:
                    type: string
                    example: "10.50"
                  required:
                    type: string
                    example: "25.00"
                required: [error, balance, required]
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: rate_limit_exceeded
                  reset:
                    type: string
                    example: "1712345678"
                  retry_after:
                    type: integer
                    example: 30
                required: [error, reset, retry_after]
        "503":
          description: Reservation or upstream service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "ca_<key> or st_<token>"
      description: |
        Authenticate via `Authorization: Bearer <token>`.

        Two token types are accepted:
        - **API keys** — prefix `ca_`, e.g. `ca_f8a2b1c3d4e5...`
        - **Session tokens** — prefix `st_`, e.g. `st_a1b2c3d4e5f6...`

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ── Shared ──────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
      required: [error]

    # ── API Keys ────────────────────────────────
    CreateKeyRequest:
      type: object
      properties:
        label:
          type: string
          description: Human-readable label for the key
          example: My Production Key
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: |
            Expiration timestamp. Defaults to 30 days from creation
            if not provided.
      required: [label]

    CreateKeyResponse:
      type: object
      properties:
        key:
          type: string
          description: The raw API key (shown once)
          example: ca_f8a2b1c3d4e5f6a7b8c9d0e1f2a3b4c5
        id:
          type: string
          format: uuid
          description: API key ID
        label:
          type: string
          description: Human-readable label
        status:
          type: string
          enum: [active, revoked, expired]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
      required: [key, id, label, status, created_at]

    ListKeysItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, revoked, expired]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
      required: [id, label, status, created_at]

    RevokeKeyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        status:
          type: string
          enum: [active, revoked, expired]
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
      required: [id, label, status, created_at]

    # ── Sessions ────────────────────────────────
    CreateSessionRequest:
      type: object
      properties:
        label:
          type: string
          description: Human-readable label for the session
          example: Dashboard Session
        scope:
          type: string
          nullable: true
          description: Optional scope restriction
        ttl:
          type: string
          description: |
            Time-to-live as a Go duration string
            (e.g. `1h`, `24h`, `7d`). Defaults to `1h`.
          example: 24h
      required: [label]

    CreateSessionResponse:
      type: object
      properties:
        token:
          type: string
          description: The raw session token (shown once)
          example: st_a1b2c3d4e5f6a7b8c9d0e1f2
        id:
          type: string
          format: uuid
        label:
          type: string
        scope:
          type: string
          nullable: true
        expires_at:
          type: string
          format: date-time
      required: [token, id, label, scope, expires_at]

    SessionToken:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        label:
          type: string
          nullable: true
        scope:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, revoked, expired]
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required: [id, user_id, label, scope, status, expires_at, created_at]

    RevokeSessionResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
      required: [id, label, status]

    # ── Providers ───────────────────────────────
    CreateProviderRequest:
      type: object
      properties:
        name:
          type: string
          description: Provider name
          example: OpenAI
        base_url:
          type: string
          format: uri
          description: Upstream base URL
          example: https://api.openai.com
      required: [name, base_url]

    UpdateProviderRequest:
      type: object
      properties:
        name:
          type: string
          description: Provider name
        base_url:
          type: string
          format: uri
          description: Upstream base URL
      minProperties: 1

    UpdateProviderStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [active, inactive, suspended]
          description: New provider status
      required: [status]

    Provider:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        name:
          type: string
        base_url:
          type: string
          format: uri
        status:
          type: string
          enum: [active, inactive, suspended]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, owner_id, name, base_url, status, created_at, updated_at]

    # ── Endpoints ───────────────────────────────
    CreateEndpointRequest:
      type: object
      properties:
        route:
          type: string
          description: Route path (e.g. `v1/chat/completions`)
          example: v1/chat/completions
        method:
          type: string
          description: HTTP method
          example: POST
        price_amount:
          type: string
          description: Price per request in the specified currency
          example: "0.01"
        currency:
          type: string
          enum: [XLM, USDC]
          default: XLM
          description: Billing currency (defaults to XLM)
        rate_limit:
          type: integer
          nullable: true
          description: Max requests per rate limit window
      required: [route, method, price_amount]

    UpdateEndpointRequest:
      type: object
      properties:
        route:
          type: string
          description: Route path
        method:
          type: string
          description: HTTP method
        price_amount:
          type: string
          description: Price per request
        currency:
          type: string
          enum: [XLM, USDC]
        rate_limit:
          type: integer
          nullable: true
          description: Max requests per rate limit window
      minProperties: 1

    UpdateEndpointStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [active, inactive, draft]
          description: New endpoint status
      required: [status]

    Endpoint:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        route:
          type: string
        method:
          type: string
        price_amount:
          type: string
          description: Price per request as a decimal string
        currency:
          type: string
          enum: [XLM, USDC]
        rate_limit:
          type: integer
          nullable: true
        status:
          type: string
          enum: [active, inactive, draft]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, provider_id, route, method, price_amount, currency, status, created_at, updated_at]

    # ── Accounts ────────────────────────────────
    AccountResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        balance:
          type: string
          description: Current balance as a decimal string
          example: "100.50"
        currency:
          type: string
          example: XLM
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, balance, currency, created_at, updated_at]

    EntryResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entry_type:
          type: string
          enum: [deposit, reservation, deduction, refund, settlement]
        amount:
          type: string
          description: Entry amount as a decimal string
        balance_after:
          type: string
          description: Balance after this entry
        currency:
          type: string
          example: XLM
        reference_type:
          type: string
          nullable: true
        status:
          type: string
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required: [id, entry_type, amount, balance_after, currency, status, created_at]

    ListEntriesResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/EntryResponse"
        total:
          type: integer
          description: Total matching entries
        limit:
          type: integer
        offset:
          type: integer
      required: [entries, total, limit, offset]

    # ── Deposits ────────────────────────────────
    DepositIntentResponse:
      type: object
      properties:
        sep7_uri:
          type: string
          description: SEP-7 URI for wallet deep link
          example: web+stellar:deposit?asset=XLM&destination=G...
        qr_code:
          type: string
          description: Base64-encoded PNG QR code
        memo:
          type: string
          description: Unique deposit memo
        destination:
          type: string
          description: Hot wallet address
        minimum_amount:
          type: string
          description: Minimum deposit amount
        asset:
          type: string
          example: XLM
      required: [sep7_uri, qr_code, memo, destination, minimum_amount, asset]

    DepositResponse:
      type: object
      properties:
        id:
          type: string
        amount:
          type: string
        currency:
          type: string
        tx_hash:
          type: string
        status:
          type: string
        from_address:
          type: string
        created_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
          nullable: true
      required: [id, amount, currency, tx_hash, status, from_address, created_at]

    # ── Settlements ─────────────────────────────
    ListSettlementsResponse:
      type: object
      properties:
        batches:
          type: array
          items:
            $ref: "#/components/schemas/SettlementBatch"
        total:
          type: integer
          description: Total number of batches
      required: [batches, total]

    SettlementBatch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          description: Batch status
        total_amount:
          type: string
          description: Total settlement amount
        currency:
          type: string
        entry_count:
          type: integer
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        entries:
          type: array
          items:
            $ref: "#/components/schemas/SettlementEntry"
      required: [id, status, total_amount, currency, entry_count, created_at, entries]

    SettlementEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        provider_id:
          type: string
          format: uuid
        amount:
          type: string
        currency:
          type: string
        wallet_address:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
      required: [id, provider_id, amount, currency, wallet_address, status, created_at]
