services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - psql_volume:/var/lib/postgresql/data
    networks:
      - castellan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - castellan
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DATABASE_URL: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      PORT: "8081"
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}?sslmode=disable"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.castellan-api.rule=Host(`tnozabooaohax5j1dueeluwp.169.58.12.23.sslip.io`)"
      - "traefik.http.routers.castellan-api.entrypoints=web"
      - "traefik.http.services.castellan-api.loadbalancer.server.port=8081"
    networks:
      - castellan
      - coolify

  settlement-worker:
    image: ghcr.io/blazinglystellar/castellan-worker:latest
    pull_policy: always
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DATABASE_URL: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
    networks:
      - castellan
volumes:
  psql_volume:
  redis_data:

networks:
  castellan:
  coolify:
    external: true
