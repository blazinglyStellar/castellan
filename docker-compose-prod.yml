services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - psql_volume:/var/lib/postgresql/data
    networks:
      - castellan
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - castellan
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8081"
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DATABASE_URL: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      PORT: "8081"
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}?sslmode=disable"
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.castellan-api.rule=Host(`tnozabooaohax5j1dueeluwp.169.58.12.23.sslip.io`)"
    #   - "traefik.http.routers.castellan-api.entrypoints=web"
    #   - "traefik.http.services.castellan-api.loadbalancer.server.port=8081"
    networks:
      - castellan
      # - coolify

  settlement-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DATABASE_URL: "postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_DATABASE}?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
    networks:
      - castellan

  frontend:
    build:
      context: ./app-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api:8081}
        NEXT_PUBLIC_STELLAR_NETWORK: ${NEXT_PUBLIC_STELLAR_NETWORK:-testnet}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api:8081}
      NEXT_PUBLIC_STELLAR_NETWORK: ${NEXT_PUBLIC_STELLAR_NETWORK:-testnet}
      PORT: "3000"
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.castellan-frontend.rule=Host(`tnozabooaohax5j1dueeluwp.169.58.12.23.sslip.io`) && PathPrefix(`/app`)"
    #   - "traefik.http.routers.castellan-frontend.entrypoints=web"
    #   - "traefik.http.services.castellan-frontend.loadbalancer.server.port=3000"
    networks:
      - castellan
      # - coolify

volumes:
  psql_volume:
  redis_data:

networks:
  castellan:
  coolify:
    external: true
